name: Publish to Maven Central

on:
  workflow_dispatch:
  push:
    # Only a v* tag publishes. Central versions are permanent, so a push to a
    # branch never uploads anything.
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          # Writes a settings.xml <server id="central"> (matching publishingServerId
          # in the POM) whose credentials come from the env vars named here.
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          # Imports the signing key; maven-gpg-plugin reads MAVEN_GPG_PASSPHRASE.
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # The tag must match the POM, or the wrong version would be uploaded.
      - name: Check the tag matches the POM version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$VER" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match POM version $VER."
            exit 1
          fi

      # autoPublish=false in the POM: this uploads and validates the bundle, then
      # waits on central.sonatype.com for someone to press Publish or Drop.
      - name: Upload to Maven Central
        run: mvn -B -Prelease deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
